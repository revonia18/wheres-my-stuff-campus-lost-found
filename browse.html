<!DOCTYPE html>
<html>

<head>
    <title>Where's My Stuff</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Where's My Stuff</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="report.html">Report</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="find">
            <br><br><br>
            <form>
                <label for="site-search">Search:</label>
                <input type="search" id="site-search" name="q" placeholder="Type here to search..." required>
                <button type="submit">Search</button>

                <label for="filter">Filter</label>
                <input type="dropdown">

                <label for="date-lost">Date Lost</label>
                <input type="date">

                <label for="Location">Location</label>
                <input type="text">
            </form>
        </section>

        <section id="card-row">
            <div class="card">
                <div class="card-image"><img src="images/airpods.jpg" alt="Airpods with a pink polkadot case" /></div>
                <div class="card-content">
                    <h3 class="card-title">Airpods</h3>
                    <div class="card-info">Student Centre<br>
                        Date found : 09/02<br>
                    </div>

                    <a href="" class="contact-btn">Contact Finder</a>
                </div>
            </div>

            <div class="card">
                <div class="card-image"><img src="images/textbook.jpg" alt="Pink Chemistry Textbook" /></div>
                <div class="card-content">
                    <h3 class="card-title">Textbook</h3>
                    <div class="card-info">
                        B Block ,B2<br>
                        Date found : 09/02<br>
                    </div>

                    <a href="" class="contact-btn">Contact Finder</a>
                </div>
            </div>

            <div class="card">
                <div class="card-image"><img src="images/keys.jpg" alt="Keys" /></div>
                <div class="card-content">
                    <h3 class="card-title">Keys</h3>
                    <div class="card-info">
                        The Barn<br>
                        Date found : 09/02<br>
                    </div>

                    <a href="" class="contact-btn">Contact Finder</a>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>
    <script src="script.js"></script>
</body>

</html>

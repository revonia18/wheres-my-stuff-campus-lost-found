<!DOCTYPE html>
<html>

<head>
    <title>Where's My Stuff</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Where's My Stuff</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="report.html">Report</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="screenheading">Help Someone Find Their Stuff!</h1>
        <h2>Report Fome</h2>
        <form>
            <label for="itemname">Name of Item*</label>
            <input type="text" required id="itemname">
            <br><br>
            <label for="datefound">Date Found*</label>
            <input type="date" required id="datefound">
            <br><br>
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="" disabled selected>Select a category</option>
                <option value="electronics">Electronics & Tech</option>
                <option value="cards-ids">IDs, Cards & Wallets</option>
                <option value="keys">Keys & Badges</option>
                <option value="bags">Bags & Backpacks</option>
                <option value="clothing">Clothing & Wearables</option>
                <option value="drinkware">Water Bottles & Mugs</option>
                <option value="books">Books & Stationery</option>
                <option value="eyewear">Eyewear & Accessories</option>
                <option value="other">Other / Misc</option>
            </select>
            <br><br>
            <label for="itemname">Location Found*</label>
            <input type="" required id="itemname">
            <br><br>
            <button>
                <label for="item-photo">Upload Picture of Item</label>
                <input type="file" id="item-photo" accept="image/*" class="file-input" hidden />
            </button>
            <br><br><br>
            <button>Submit</button>

        </form>
    </main>

    <footer></footer>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Where's My Stuff</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Where's My Stuff</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="report.html">Report</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="screenheading">Help Someone Find Their Stuff!</h1>
        <section>
            <form class="report-card">
                <h2 class="form-heading">Report Form</h2>
                <label for="itemname">Name of Item*</label>
                <input type="text" required id="itemname">
                <br><br>
                <label for="datefound">Date Found*</label>
                <input type="date" required id="datefound">
                <br><br>
                <label for="category">Category:*</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="electronics">Electronics & Tech</option>
                    <option value="cards-ids">IDs, Cards & Wallets</option>
                    <option value="keys">Keys & Badges</option>
                    <option value="bags">Bags & Backpacks</option>
                    <option value="clothing">Clothing & Wearables</option>
                    <option value="drinkware">Water Bottles & Mugs</option>
                    <option value="books">Books & Stationery</option>
                    <option value="eyewear">Eyewear & Accessories</option>
                    <option value="other">Other / Misc</option>
                </select>
                <br><br>
                <label for="place-found">Place Found*</label>
                <select id="place-found" name="place-found" required>
                    <option value="" disabled selected>Select a location</option>
                    <option value="B Lecture Halls">B Lecture Halls</option>
                    <option value="A Lecture Halls">A Lecture Halls</option>
                    <option value=" Gym">Gym</option>
                    <option value="Res Life">Res Life</option>
                    <option value="Student Center">Student Center</option>
                    <option value="Computational Mathematics">Computational Mathematics </option>
                    <option value="Life Science Auditorium">Life Science Auditorium</option>
                    <option value="Senate Hall">Senate Hall</option>
                    <option value="Jakes Gerwell Hall">Jakes Gerwell Hall</option>
                    <option value="The Barn">The Barn</option>
                </select>
                <br><br>
                <label for="item-description">Additional Details / Comments</label>
                <textarea id="item-description" name="description" rows="4"
                    placeholder="Describe unique features (e.g. stickers, scratches, case color, or specific desk location)..."
                    required></textarea>
                <br><br>
                <button>
                    <label for="item-photo">Upload Picture of Item*</label>
                    <input type="file" id="item-photo" accept="image/*" class="file-input" hidden required />
                </button>
                <br><br><br>
                <button class="submit-btn">Submit</button>

            </form>
        </section>
    </main>

    <footer></footer>
</body>

</html>
